services:
  postgres:
    image: postgres:16
    container_name: jaytrix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: jaytrix
      POSTGRES_PASSWORD: strongpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaytrix -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: jaytrix_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://jaytrix:strongpassword@postgres:5432/marketplace
      DB_DIALECT: postgres
      DB_SSL: "false"
      DB_SYNC: "false"
      DB_SYNC_ALTER: "false"
    ports:
      - "5000:5000"
    command: sh -c "npm run migrate && npm start"

volumes:
  pgdata:
